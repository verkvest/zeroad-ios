name: ios-spidermonkey

# SpiderMonkey 128 (interpreter-only / Portable Baseline Interpreter) for iOS.
# Separate workflow because it is the slowest and riskiest dependency.
on:
  push:
    branches: ["feature/**"]
    paths: ["ios/build-spidermonkey-ios.sh", "patches/spidermonkey/**", ".github/workflows/ios-spidermonkey.yml", "scripts/fetch-0ad.sh"]
  workflow_dispatch:

jobs:
  spidermonkey:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        platform: [iphonesimulator]
    env:
      PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.82.0 --profile minimal
          rustup default 1.82.0
          rustup target add aarch64-apple-ios-sim aarch64-apple-ios
          rustc --version
          brew install cbindgen && cbindgen --version
      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: build/deps/${{ matrix.platform }}
          key: mozjs-${{ matrix.platform }}-${{ hashFiles('ios/build-spidermonkey-ios.sh', 'patches/spidermonkey/**', 'scripts/fetch-0ad.sh') }}
      - name: Build SpiderMonkey for iOS (no JIT)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          scripts/fetch-0ad.sh
          ios/build-spidermonkey-ios.sh
      - name: Pack
        run: tar -C build/deps -czf mozjs-${PLATFORM}.tar.gz ${PLATFORM}
      - uses: actions/upload-artifact@v4
        with:
          name: mozjs-${{ matrix.platform }}
          path: mozjs-${{ matrix.platform }}.tar.gz
          retention-days: 14
