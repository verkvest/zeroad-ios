# Optional: sign + upload the current iOS app to TestFlight.
# Manual (workflow_dispatch) or by pushing a tag testflight-*. Skips cleanly (green) when secrets are absent.
#
# Required repo secrets (set them in GitHub → Settings → Secrets → Actions; never commit them):
#   APPSTORE_API_KEY_P8      – contents of AuthKey_<KEYID>.p8, base64-encoded (base64 -i AuthKey_X.p8)
#   APPSTORE_API_KEY_ID      – e.g. the "Codemagic" key id
#   APPSTORE_API_ISSUER_ID   – App Store Connect issuer id
# The key needs the Admin or App Manager role so that Xcode can create the
# distribution certificate + provisioning profile automatically (cloud signing).
# The App Store Connect app record for the bundle id must exist before the first upload.
name: ios-testflight

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle identifier
        default: es.verkvest.zeroad
      version:
        description: Marketing version
        default: 0.1.0
      app:
        description: "touchdemo | engine"
        default: touchdemo
  push:
    tags: ["testflight-*"]

env:
  TEAM_ID: 38PT254HDZ
  BUNDLE_ID: ${{ inputs.bundle_id || 'es.verkvest.zeroad' }}
  APP_VERSION: ${{ inputs.version || '0.1.0' }}
  # tag testflight-engine-* (or input app=engine) uploads the real engine built by ios-build; else the touch demo
  APP_KIND: ${{ (inputs.app == 'engine' || startsWith(github.ref_name, 'testflight-engine')) && 'engine' || 'touchdemo' }}

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    env:
      PLATFORM: iphoneos
      HAS_KEY: ${{ secrets.APPSTORE_API_KEY_P8 != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_ISSUER_ID != '' }}
    steps:
      - name: Check secrets
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::App Store Connect API key secrets are not set – skipping signing and upload."
          fi
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - name: Tools + Xcode 26 (App Store requires the iOS 26 SDK)
        if: env.HAS_KEY == 'true'
        run: |
          brew install ninja || true
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Cache deps
        if: env.HAS_KEY == 'true' && env.APP_KIND == 'touchdemo'
        uses: actions/cache@v4
        with:
          path: build/deps/iphoneos
          key: deps-iphoneos-${{ hashFiles('ios/build-ios-deps.sh', 'ios/env.sh') }}
          restore-keys: deps-iphoneos-
      - name: Build SDL2 for device
        if: env.HAS_KEY == 'true' && env.APP_KIND == 'touchdemo'
        run: ios/build-ios-deps.sh sdl2
      - name: Install API key
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8 }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEYFILE=~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8
          # accept either raw PEM or base64 of it; never echo the key
          if printf '%s' "$APPSTORE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APPSTORE_API_KEY_P8" > "$KEYFILE"
          else
            printf '%s' "$APPSTORE_API_KEY_P8" | base64 --decode > "$KEYFILE"
          fi
          chmod 600 "$KEYFILE"
          echo "KEYFILE=$KEYFILE" >> "$GITHUB_ENV"
      - name: Generate Xcode project
        if: env.HAS_KEY == 'true' && env.APP_KIND == 'touchdemo'
        run: |
          . ios/env.sh
          cmake -S touchdemo -B build/xcode -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_PREFIX_PATH="$DEPS_PREFIX" -DSDL2_DIR="$DEPS_PREFIX/lib/cmake/SDL2" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DAPP_BUNDLE_ID="$BUNDLE_ID" \
            -DAPP_VERSION="$APP_VERSION" -DAPP_BUILD="${{ github.run_number }}" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="$TEAM_ID" -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Automatic
      - name: Archive (unsigned; the team has no devices, so no development profile)
        if: env.HAS_KEY == 'true' && env.APP_KIND == 'touchdemo'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          xcodebuild -project build/xcode/zeroad_touchdemo.xcodeproj -scheme touchdemo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/ZeroAD.xcarchive" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SKIP_INSTALL=NO INSTALL_PATH=/Applications \
            archive | tee "$RUNNER_TEMP/archive.log" | tail -60
          test ${PIPESTATUS[0]} -eq 0
          # must be an iOS app archive (Products/Applications/*.app + ApplicationProperties), not a generic one
          find "$RUNNER_TEMP/ZeroAD.xcarchive" -maxdepth 3 | head -20
          /usr/libexec/PlistBuddy -c Print "$RUNNER_TEMP/ZeroAD.xcarchive/Info.plist"
      - name: Engine archive from the latest ios-build device artifact
        if: env.HAS_KEY == 'true' && env.APP_KIND == 'engine'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          # newest ios-build run whose device artifact actually contains the packaged engine app
          Z=""
          for r in $(gh run list -R "$GITHUB_REPOSITORY" -w ios-build.yml -b feature/ios-prototype -L 15 --json databaseId -q '.[].databaseId'); do
            rm -rf "$RUNNER_TEMP/eng"
            gh run download "$r" -R "$GITHUB_REPOSITORY" -n engine-iphoneos-log -D "$RUNNER_TEMP/eng" 2>/dev/null || continue
            Z=$(find "$RUNNER_TEMP/eng" -name 'Pyrogenesis-iphoneos.app.zip' | head -1)
            [ -n "$Z" ] && { echo "using ios-build run $r"; break; }
          done
          [ -n "$Z" ] || { echo "::error::no ios-build run with a packaged device engine app"; exit 1; }
          ditto -x -k "$Z" "$RUNNER_TEMP/engapp"
          scripts/make-engine-xcarchive.sh "$RUNNER_TEMP/engapp/Pyrogenesis.app" "$RUNNER_TEMP/ZeroAD.xcarchive" \
            "$BUNDLE_ID" "$APP_VERSION" "${{ github.run_number }}"
      - name: Export with App Store distribution signing (cloud-managed via API key) + upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ZeroAD.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$APPSTORE_API_KEY_ID" -authenticationKeyIssuerID "$APPSTORE_API_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"
          xcrun altool --upload-app -t ios -f "$RUNNER_TEMP"/export/*.ipa \
            --apiKey "$APPSTORE_API_KEY_ID" --apiIssuer "$APPSTORE_API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          # altool may exit 0 on errors; fail explicitly
          if grep -q "ERROR" "$RUNNER_TEMP/upload.log"; then
            grep -q "Cannot determine the Apple ID" "$RUNNER_TEMP/upload.log" && \
              echo "::error::No App Store Connect app record for $BUNDLE_ID yet (create it in App Store Connect → Apps → +)"
            exit 1
          fi
          echo "::notice::Uploaded $BUNDLE_ID $APP_VERSION (${{ github.run_number }}) to App Store Connect"
      - uses: actions/upload-artifact@v4
        if: always() && env.HAS_KEY == 'true'
        with:
          name: testflight-logs
          path: ${{ runner.temp }}/archive.log
          if-no-files-found: ignore
      - name: Cleanup key
        if: always()
        run: rm -rf ~/.appstoreconnect/private_keys
