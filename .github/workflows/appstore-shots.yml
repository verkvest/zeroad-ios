# App Store screenshots: reuse the simulator app of an ios-build run, refresh its ios mod from
# this commit (ios/make-ios-mod.py), and record the -conf=ios.shots:true scene on a 6.9" iPhone
# and a 13" iPad in landscape. Runs on a push to the appstore-shots branch (or manually).
name: appstore-shots
on:
  push:
    branches: [appstore-shots]
  workflow_dispatch:
    inputs:
      build_run:
        description: ios-build run id that has the engine-iphonesimulator-log artifact
        required: false
jobs:
  shots:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: engine-iphonesimulator-log
          run-id: ${{ inputs.build_run || '40110433854' }}
          github-token: ${{ github.token }}
          path: art
      - name: Xcode 26
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -1)
          [ -n "$X" ] && sudo xcode-select -s "$X"
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone .*Pro Max|iPad Pro 13" || true
      - name: App with this commit's ios mod
        run: |
          mkdir -p build z
          ditto -x -k "$(find art -name Pyrogenesis-iphonesimulator.app.zip | head -1)" build
          APP=build/Pyrogenesis.app
          cp "$APP/data/mods/public/public.zip" z/public-mobile.zip
          cp "$APP/data/mods/mod/mod.zip" z/mod.zip
          rm -rf "$APP/data/mods/ios"
          python3 ios/make-ios-mod.py z/public-mobile.zip "$APP/data/mods/ios"
          # Full-screen landscape on iPad too (otherwise the simulator letterboxes it in portrait).
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$APP/Info.plist" || true
          codesign --force --sign - "$APP"
      - name: iPhone 6.9"
        continue-on-error: true
        timeout-minutes: 20
        env:
          SHOT_EVERY: "5"
          SIM_DEVICE: "^iPhone \\d+ Pro Max$"
        run: python3 scripts/sim-launch.py build/Pyrogenesis.app es.verkvest.zeroad out/iphone 200 -conf=ios.autoquickplay:true -conf=ios.shots:true
      - name: iPad 13"
        continue-on-error: true
        timeout-minutes: 25
        env:
          SHOT_EVERY: "5"
          SIM_DEVICE: "^iPad Pro 13"
        run: python3 scripts/sim-launch.py build/Pyrogenesis.app es.verkvest.zeroad out/ipad 230 -conf=ios.autoquickplay:true -conf=ios.shots:true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appstore-shots
          path: out
